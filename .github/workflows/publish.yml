# Publish at the brand.json slot times (spec 8). Odd-minute UTC crons are GENERATED from
# brand/brand.json by src/cli/gen-publish-cron.ts (CI fails on drift). Do not edit them by hand.
# approvals -> download the approved reel artifact -> container -> upload -> publish -> ledger;
# then comment replies. No Remotion and no Python here. PUBLISH_MODE=dry_run (default) = zero
# external writes; the code also re-checks data/control.json before every write.
name: publish

on:
  schedule:
    # BEGIN GENERATED SLOTS (from brand/brand.json slots; regenerate: npx tsx src/cli/gen-publish-cron.ts)
    - cron: '1 3 * * *' # 08:30 IST slot (03:01 UTC)
    - cron: '1 6 * * *' # 11:30 IST slot (06:01 UTC)
    - cron: '31 7 * * *' # 13:00 IST slot (07:31 UTC)
    - cron: '31 8 * * *' # 14:00 IST slot (08:31 UTC)
    - cron: '1 13 * * *' # 18:30 IST slot (13:01 UTC)
    - cron: '1 14 * * *' # 19:30 IST slot (14:01 UTC)
    - cron: '1 16 * * *' # 21:30 IST slot (16:01 UTC)
    # END GENERATED SLOTS
  workflow_dispatch:

permissions:
  contents: write # commits data/queue, data/ledger, data/engage, data/approvals
  actions: read # download the reel artifact uploaded by produce (GH_TOKEN)

concurrency:
  group: publish
  cancel-in-progress: false

env:
  ENV_FILE: api_keys/.env # absent on the runner; settings come from repository variables
  PUBLISH_MODE: ${{ vars.PUBLISH_MODE || 'dry_run' }}
  REPLY_MODE: ${{ vars.REPLY_MODE || 'approval' }}
  LEARNING_MODE: ${{ vars.LEARNING_MODE || 'propose' }}
  REELS_PER_DAY: ${{ vars.REELS_PER_DAY || '3' }}
  PIPELINE_PAUSED: ${{ vars.PIPELINE_PAUSED || 'false' }}
  TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Kolkata' }}
  META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
  CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
  MAX_DAILY_SPEND_USD: ${{ vars.MAX_DAILY_SPEND_USD || '0' }}
  ARTIFACT_RETENTION_DAYS: ${{ vars.ARTIFACT_RETENTION_DAYS || '3' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Kill switch
        id: gate
        run: bash .github/scripts/kill-switch.sh
      - uses: ./.github/actions/setup-node
        if: steps.gate.outputs.paused != 'true'
        with:
          remotion: 'false'
      - name: Publish due reels
        id: publish
        if: steps.gate.outputs.paused != 'true'
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          t0=$(date +%s)
          npm run publish
          echo "seconds=$(( $(date +%s) - t0 ))" >> "$GITHUB_OUTPUT"
      - name: Comment replies
        if: always() && steps.gate.outputs.paused != 'true' && steps.publish.outcome != 'skipped'
        timeout-minutes: 8
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run engage
      - name: Commit publish state (own paths only)
        if: always() && steps.gate.outputs.paused != 'true'
        run: |
          bash .github/scripts/commit-state.sh "state(publish): $(TZ=Asia/Kolkata date '+%F %H:%M')" \
            data/queue data/ledger data/engage data/approvals data/telegram data/control.json
      - name: Minutes report
        if: always()
        env:
          PUBLISH_S: ${{ steps.publish.outputs.seconds }}
        run: |
          echo "publish: ${PUBLISH_S:-n/a}s" >> "$GITHUB_STEP_SUMMARY"
      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bash .github/scripts/alert.sh "publish workflow failed"
